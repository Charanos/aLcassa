name: CI

# 04 §9 · 11 §5. The gates that block a merge.
#
# ⚠ THIS WORKFLOW HAD NEVER RUN A SINGLE JOB BEFORE 28 Aug 2026.
#
# It called `pnpm install --frozen-lockfile` while the repository contained only
# `package-lock.json`. pnpm exits immediately when asked for a frozen install
# with no `pnpm-lock.yaml`, so every job died at the install step — including
# the isolation suite that `04 §11` calls "blocking with no override path" and
# the policy check that `06 §2` says "fails the build".
#
# Both pass, and have passed throughout, because they were run by hand. But the
# enforcement everybody was relying on was not there. The lockfile is now
# committed and this file describes only what it actually does.
#
# The previous header also promised contract tests against the OpenAPI
# specification, Playwright on the critical paths and an axe accessibility
# scan. None of those existed as jobs. They are recorded as outstanding in
# `12 · Handover` rather than described here as though they run.

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # An import that package.json does not declare resolves today only if a
      # transitive dependency happens to provide it. npm's flat node_modules
      # hid six such imports of dotenv for months; pnpm refused them and the
      # Vercel build failed. Ten seconds here beats a broken deploy.
      - run: pnpm check:deps

  # 11 §6 rule 19: a type error is a failed build, never a warning. That is only
  # true if the build runs, and it did not. A broken build could reach `main`
  # with every other job green.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: static
    env:
      # `next build` evaluates route modules, and the Supabase client throws at
      # import time on a missing key. These are placeholders with the right
      # SHAPE and no access to anything — the build must not need real secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  isolation:
    name: Policies and isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aLcassa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # ⚠ TWO ROLES, AND CONFLATING THEM MAKES THE ISOLATION SUITE PROVE
      #   NOTHING. Both of these were `postgres` until 28 Aug 2026, and
      #   `postgres` carries BYPASSRLS — every policy inert for the connection
      #   the suite runs on. 66 cases failed on the first run that reached a
      #   database, which is the good outcome. See scripts/create-app-role.ts.
      DATABASE_URL: postgresql://alcassa_app:alcassa_app@localhost:5432/aLcassa_test
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/aLcassa_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # After the schema, so the grants have tables to apply to; before
      # anything connects as the app role.
      - run: pnpm db:app-role
      - run: pnpm db:seed

      # 06 §2 rule 1. A tenant-scoped table without a policy fails the build.
      # This runs before the tests and there is no override path.
      - name: Policy check
        run: pnpm check:policies

      # 04 §11 · 11 §5. Blocks merge. No override, no exception path.
      # This is the gate that lets Brian be told the guarantee holds today.
      - name: Isolation suite
        run: pnpm test:isolation

      # 08 §3. The counters the entitlement guard reads must match the rows
      # they are derived from. Report only — it never repairs in CI, because
      # "alerts on divergence rather than silently correcting it" is the whole
      # point and a job that quietly fixed drift would hide its cause.
      - name: Usage reconciliation
        run: pnpm reconcile:usage

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aLcassa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # ⚠ TWO ROLES, AND CONFLATING THEM MAKES THE ISOLATION SUITE PROVE
      #   NOTHING. Both of these were `postgres` until 28 Aug 2026, and
      #   `postgres` carries BYPASSRLS — every policy inert for the connection
      #   the suite runs on. 66 cases failed on the first run that reached a
      #   database, which is the good outcome. See scripts/create-app-role.ts.
      DATABASE_URL: postgresql://alcassa_app:alcassa_app@localhost:5432/aLcassa_test
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/aLcassa_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # After the schema, so the grants have tables to apply to; before
      # anything connects as the app role.
      - run: pnpm db:app-role
      - run: pnpm db:seed
      - run: pnpm test

  cache-disabled:
    name: Test suite, cache disabled
    runs-on: ubuntu-latest
    needs: static
    # 08 §6 · definition of done condition 9.
    #
    # With Redis switched off entirely, every correctness property still holds.
    # Only speed changes. This job is what makes that a measurement rather than
    # a claim: if anything fails here, something has started treating the cache
    # as a source of truth and it is a defect.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aLcassa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # ⚠ TWO ROLES, AND CONFLATING THEM MAKES THE ISOLATION SUITE PROVE
      #   NOTHING. Both of these were `postgres` until 28 Aug 2026, and
      #   `postgres` carries BYPASSRLS — every policy inert for the connection
      #   the suite runs on. 66 cases failed on the first run that reached a
      #   database, which is the good outcome. See scripts/create-app-role.ts.
      DATABASE_URL: postgresql://alcassa_app:alcassa_app@localhost:5432/aLcassa_test
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/aLcassa_test
      CACHE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # After the schema, so the grants have tables to apply to; before
      # anything connects as the app role.
      - run: pnpm db:app-role
      - run: pnpm db:seed
      - run: pnpm test

  # 04 §7. A known-vulnerable dependency is a security finding, and finding it
  # at handover is finding it late. `--audit-level moderate` rather than `low`:
  # a gate that cries wolf on every transitive advisory gets switched off.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
