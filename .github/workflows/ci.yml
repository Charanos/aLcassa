name: CI

# Required static, build, isolation and integration release checks.

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # An import that package.json does not declare resolves today only if a
      # transitive dependency happens to provide it. npm's flat node_modules
      # hid six such imports of dotenv for months; pnpm refused them and the
      # Vercel build failed. Ten seconds here beats a broken deploy.
      - run: pnpm check:deps
      - run: pnpm check:email-templates
      - name: API and Server Action inventory drift
        run: node --import tsx scripts/verification-contract-inventory.ts --check

  # 11 §6 rule 19: a type error is a failed build, never a warning. That is only
  # true if the build runs, and it did not. A broken build could reach `main`
  # with every other job green.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: static
    env:
      # `next build` evaluates route modules, and the Supabase client throws at
      # import time on a missing key. These are placeholders with the right
      # SHAPE and no access to anything — the build must not need real secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify built authentication redirects
        run: |
          pnpm exec next start --hostname 127.0.0.1 --port 3100 > /tmp/alcassa-auth-navigation.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/sign-in > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Built authentication server did not become ready.'
            exit 1
          fi
          pnpm exec tsx scripts/check-auth-navigation.ts
          AUTH_NAVIGATION_BASE_URL=http://localhost:3100 pnpm exec tsx scripts/check-auth-navigation.ts

  isolation:
    name: Policies and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ⚠ TWO ROLES, AND CONFLATING THEM MAKES THE ISOLATION SUITE PROVE
      #   NOTHING. Both of these were `postgres` until 28 Aug 2026, and
      #   `postgres` carries BYPASSRLS — every policy inert for the connection
      #   the suite runs on. 66 cases failed on the first run that reached a
      #   database, which is the good outcome. See scripts/create-app-role.ts.
      DATABASE_URL: postgresql://alcassa_app:alcassa_app@127.0.0.1:55422/postgres
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:55422/postgres
      VERIFICATION_DISPOSABLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/verification-database
      - run: pnpm db:migrate
      # After the schema, so the grants have tables to apply to; before
      # anything connects as the app role.
      - run: pnpm db:app-role
      - run: pnpm db:seed

      - name: Deployment schema compatibility
        run: pnpm check:deployment

      # 06 §2 rule 1. A tenant-scoped table without a policy fails the build.
      # This runs before the tests and there is no override path.
      - name: Policy check
        run: pnpm check:policies

      # 04 §11 · 11 §5. Blocks merge. No override, no exception path.
      # This is the gate that lets Brian be told the guarantee holds today.
      - name: Isolation suite
        run: pnpm run test:isolation --reporter=default --reporter=json --outputFile=.test-report/phase-one/isolation.json

      # 08 §3. The counters the entitlement guard reads must match the rows
      # they are derived from. Report only — it never repairs in CI, because
      # "alerts on divergence rather than silently correcting it" is the whole
      # point and a job that quietly fixed drift would hide its cause.
      - name: Usage reconciliation
        run: pnpm reconcile:usage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation-evidence
          path: .test-report/phase-one/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    env:
      # ⚠ TWO ROLES, AND CONFLATING THEM MAKES THE ISOLATION SUITE PROVE
      #   NOTHING. Both of these were `postgres` until 28 Aug 2026, and
      #   `postgres` carries BYPASSRLS — every policy inert for the connection
      #   the suite runs on. 66 cases failed on the first run that reached a
      #   database, which is the good outcome. See scripts/create-app-role.ts.
      DATABASE_URL: postgresql://alcassa_app:alcassa_app@127.0.0.1:55422/postgres
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:55422/postgres
      VERIFICATION_DISPOSABLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/verification-database
      - run: pnpm db:migrate
      # After the schema, so the grants have tables to apply to; before
      # anything connects as the app role.
      - run: pnpm db:app-role
      - run: pnpm db:seed
      - run: pnpm run test --reporter=default --reporter=json --outputFile=.test-report/phase-one/tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-evidence
          path: .test-report/phase-one/

  cache-disabled:
    name: Test suite, cache disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    # 08 §6 · definition of done condition 9.
    #
    # With Redis switched off entirely, every correctness property still holds.
    # Only speed changes. This job is what makes that a measurement rather than
    # a claim: if anything fails here, something has started treating the cache
    # as a source of truth and it is a defect.
    env:
      # ⚠ TWO ROLES, AND CONFLATING THEM MAKES THE ISOLATION SUITE PROVE
      #   NOTHING. Both of these were `postgres` until 28 Aug 2026, and
      #   `postgres` carries BYPASSRLS — every policy inert for the connection
      #   the suite runs on. 66 cases failed on the first run that reached a
      #   database, which is the good outcome. See scripts/create-app-role.ts.
      DATABASE_URL: postgresql://alcassa_app:alcassa_app@127.0.0.1:55422/postgres
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:55422/postgres
      VERIFICATION_DISPOSABLE: 'true'
      CACHE_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/verification-database
      - run: pnpm db:migrate
      # After the schema, so the grants have tables to apply to; before
      # anything connects as the app role.
      - run: pnpm db:app-role
      - run: pnpm db:seed
      - run: pnpm run test --reporter=default --reporter=json --outputFile=.test-report/phase-one/cache-disabled.json
      - name: Prepare isolated console browser verification
        run: |
          node --import tsx scripts/verification-browser-ci-env.ts
          pnpm exec playwright install --with-deps chrome
      - name: Build the disposable console for browser acceptance
        id: console_build
        env:
          NEXT_DIST_DIR: .next-live-verify
          SESSION_COOKIE_PLATFORM: alcassa_verify_platform
          SESSION_COOKIE_TENANT: alcassa_verify_tenant
        run: pnpm build
      - name: Console action acceptance
        if: ${{ !cancelled() && steps.console_build.outcome == 'success' }}
        run: node --conditions=react-server --import tsx scripts/verification-console-operations.ts
      - name: Platform failure and recovery acceptance
        if: ${{ !cancelled() && steps.console_build.outcome == 'success' }}
        run: node --conditions=react-server --import tsx scripts/verification-platform-acceptance.ts
      - name: Platform accessibility matrix
        if: ${{ !cancelled() && steps.console_build.outcome == 'success' }}
        run: node --conditions=react-server --import tsx scripts/verification-platform-accessibility.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-disabled-evidence
          path: |
            .test-report/phase-one/cache-disabled.json
            .test-report/phase-one/console-operations.json
            .test-report/phase-one/m4-platform-acceptance.json
            .test-report/phase-one/m4-accessibility.json

  # 04 §7. A known-vulnerable dependency is a security finding, and finding it
  # at handover is finding it late. `--audit-level moderate` rather than `low`:
  # a gate that cries wolf on every transitive advisory gets switched off.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-evidence
          path: .test-report/security/
