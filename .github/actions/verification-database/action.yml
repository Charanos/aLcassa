name: Disposable verification database
description: Start the pinned Supabase provider stack without hosted credentials
runs:
  using: composite
  steps:
    - name: Start local provider stack
      shell: bash
      run: |
        # The vendor startup summary contains local keys. Keep it out of CI logs.
        npx --yes supabase@2.119.0 start --workdir verification/local \
          --exclude realtime,studio,postgres-meta,edge-runtime,logflare,vector,supavisor \
          > "$RUNNER_TEMP/alcassa-provider-start.log" 2>&1
    - name: Configure disposable Auth connection reuse
      shell: bash
      run: node --import tsx scripts/verification-auth-pool.ts
    - name: Verify provider schema
      shell: bash
      run: node --import tsx scripts/verification-provider-check.ts
    - name: Configure disposable Auth contract tests
      shell: bash
      run: node --import tsx scripts/verification-provider-env.ts
